name: public-market-quotes
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-market-quotes
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_market_quotes.py
      - run: python scripts/market_quotes.py
      - name: Publish snapshot
        run: |
          git config user.name risk-radar-bot
          git config user.email actions@users.noreply.github.com
          git add data/market-quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public quotes [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
