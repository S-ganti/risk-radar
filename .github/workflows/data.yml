name: data-pipeline

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-radar-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run pipeline
        run: python scripts/pipeline.py
      - name: Run publication gate and tests
        run: |
          python scripts/validate.py --write-health
          python -m unittest discover -s tests -p "test_*.py"
      - name: Stage refreshed data for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "risk-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json data/health.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git checkout -B automation/data-refresh
            git commit -m "data: $(date -u +%F) staged refresh"
            git push origin HEAD:automation/data-refresh --force-with-lease
            gh pr view automation/data-refresh --json url >/dev/null 2>&1 || gh pr create --base main --head automation/data-refresh --title "data: staged daily refresh" --body "Automated market-data refresh. Publication gate and pipeline tests passed; review freshness, anomalies, and the health manifest before merge."
          fi
