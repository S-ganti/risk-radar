<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Specialist contributions · Risk Radar</title><link rel="stylesheet" href="app/workspace.css"><style>body{--paper:#f3f4f5;--ink:#182734;--green:#095baf;--muted:#627281}main{margin:0;padding:20px;max-width:none}.intro{padding:0 0 16px}h1{font:600 27px 'Segoe UI',sans-serif;letter-spacing:-.5px}h2{font:600 20px 'Segoe UI',sans-serif}.panel,.empty{border-radius:3px}</style></head><body><main><div id="app"></div><footer>Research contributions · Packages are registered, never executed.<a href="https://deerflow.tech" target="_blank" rel="noopener">Created By Deerflow</a></footer></main>
<dialog id="editor"><div class="dialoghead"><h2>Register a model or dataset</h2><button type="button" id="close" aria-label="Close editor">×</button></div><form id="entryform"><input type="hidden" name="id"><div class="fields"><label>Type<select name="kind"><option>Model</option><option>Dataset</option></select></label><label>Version<input name="version" required placeholder="1.0"></label></div><label>Title<input name="title" required></label><label>Owner and specialization<input name="owner" required placeholder="Name · specialist area"></label><div class="fields"><label>Company scope<select id="companyscope" name="company"></select></label><label>As-of date<input name="asof" type="date" required></label></div><label>Question this answers<textarea name="purpose" required></textarea></label><label>Model or dataset URL<input name="url" type="url" required placeholder="https://"></label><label>Inputs, units, assumptions and limitations<textarea name="limits" required></textarea></label><label>Validation or source evidence URL<input name="evidence" type="url" placeholder="https://"></label><label>Optional JSON package (500 KB maximum)<input name="file" type="file" accept=".json,application/json"></label><p id="formerror" role="alert"></p><button type="submit" class="primary">Save draft</button></form></dialog><script src="app/workspace.js"></script></body></html>
